name: Docs Helper

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture release before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release" --jq '.object.sha')
          echo "RELEASE_BEFORE=$before" >> "$GITHUB_ENV"
          echo "Release before: $before"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ad67978e5eb3fc76e3c86855adc19db5673fa818
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_commit_signing: true
          show_full_output: true
          claude_args: |
            --max-turns 8

      - name: Capture release after
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          after=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release" --jq '.object.sha')
          echo "Release before: ${RELEASE_BEFORE:-unknown}"
          echo "Release after:  $after"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$after" \
            --jq '"Commit URL: " + .html_url, "Parent: " + .parents[0].sha, "Message: " + .commit.message'
